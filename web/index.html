<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpellCrafter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png" sizes="16x16">
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('theme')
            ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    </script>
    <script src="script.js" defer></script>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <img class="logo" src="favicon.png" alt="">
            <h1>SpellCrafter</h1>
        </div>
        <button id="editor-toggle" class="editor-toggle">
            <svg viewBox="0 0 24 24"><path d="M5 19L13 11M17 4v6M14 7h6"/></svg>
            <span>Wand Editor</span>
            <svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="actions">
            <button id="theme-toggle" class="icon-button" title="Toggle theme">
                <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
            <a class="icon-button" href="https://github.com/Ivaynn/SpellCrafter" target="_blank" title="Source code">
                <svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
            </a>
        </div>
    </header>
    <main>
        <div class="controls">
            <section class="editor">
                <div class="wand">
                    <div id="slots" class="slots"></div>
                    <div class="wand-code">
                        <div class="code">
                            <input id="wand-code" type="text" placeholder="Wand code" spellcheck="false">
                            <button id="copy-code" class="icon-button" title="Copy to clipboard">
                                <svg class="icon-copy" viewBox="0 0 24 24"><path d="M9 9h13v13H9zM5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                <svg class="icon-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                            </button>
                        </div>
                        <input id="wand-cap" type="number" min="0" max="27" title="Slots">
                    </div>
                </div>
            </section>
            <div class="toolbar">
                <input id="search" type="search" placeholder="Search">
                <select id="sort">
                    <option value="type">Type</option>
                    <option value="name">Name</option>
                    <option value="tier">Rarity</option>
                </select>
                <button id="order-toggle" class="icon-button" title="Reverse order">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                </button>
                <button id="view-toggle" class="icon-button" title="Toggle compact view">
                    <svg class="icon-grid" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>
                    <svg class="icon-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                </button>
            </div>
        </div>
        <div id="cards" class="cards"></div>
    </main>
</body>

</html>
