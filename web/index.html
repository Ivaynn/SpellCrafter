<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpellCrafter</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('theme')
            || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.classList.toggle('editing', localStorage.getItem('editing') === 'true');
        document.documentElement.classList.toggle('compact', localStorage.getItem('compact') === 'true');
    </script>
    <script src="script.js" defer></script>
</head>

<body>
    <svg style="display: none">
        <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
        <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18" /></symbol>

        <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
        <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V6a2 2 0 0 1 2-2h8" /></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7" /></symbol>
        <symbol id="icon-cards" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="1" /><rect x="4" y="14" width="16" height="6" rx="1" /></symbol>
        <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /><rect x="14" y="14" width="6" height="6" rx="1" /></symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
        <symbol id="icon-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></symbol>
        <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></symbol>
        <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>

        <symbol id="icon-github" viewBox="0 0 16 16"><path fill="currentColor" stroke="none" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" /></symbol>
    </svg>

    <header>
        <div class="brand">
            <img src="favicon.png" alt="">
            <h1>SpellCrafter</h1>
        </div>
        <div class="tools">
            <label class="search">
                <svg class="icon"><use href="#icon-search" /></svg>
                <input id="search" type="search" spellcheck="false" autocomplete="off">
                <button id="search-clear" class="field-button" type="button" hidden>
                    <svg class="icon"><use href="#icon-x" /></svg>
                </button>
            </label>
            <button id="editor-toggle">
                <span id="editor-label"></span>
                <svg class="icon chevron"><use href="#icon-chevron" /></svg>
            </button>
        </div>
        <div class="actions">
            <button id="theme-toggle">
                <svg class="icon sun"><use href="#icon-sun" /></svg>
                <svg class="icon moon"><use href="#icon-moon" /></svg>
            </button>
            <button id="compact-toggle">
                <svg class="icon cards-icon"><use href="#icon-cards" /></svg>
                <svg class="icon grid-icon"><use href="#icon-grid" /></svg>
            </button>
            <button id="language-button" popovertarget="language-menu">
                <svg class="icon"><use href="#icon-globe" /></svg>
            </button>
            <a href="https://discord.gg/QAtc7ZgPxS" target="_blank">
                <svg class="icon"><use href="#icon-discord" /></svg>
            </a>
            <a href="https://github.com/Ivaynn/SpellCrafter" target="_blank">
                <svg class="icon"><use href="#icon-github" /></svg>
            </a>
        </div>
    </header>

    <section class="wand">
        <div class="drawer">
            <div class="wand-content">
                <div class="row">
                    <div class="code">
                        <input id="code" type="text" spellcheck="false" autocomplete="off">
                        <button id="copy-code" class="field-button" type="button">
                            <svg class="icon copy-icon"><use href="#icon-copy" /></svg>
                            <svg class="icon check-icon"><use href="#icon-check" /></svg>
                        </button>
                    </div>
                    <button id="reset"><svg class="icon"><use href="#icon-reset" /></svg></button>
                    <div class="cap">
                        <span id="count"></span>
                        <span>/</span>
                        <span id="cap"></span>
                    </div>
                    <button id="settings-button"><svg class="icon"><use href="#icon-gear" /></svg></button>
                </div>
                <div id="slots"></div>
            </div>
        </div>
    </section>

    <main>
        <div id="list"></div>
    </main>

    <dialog id="settings">
        <div class="dialog-content">
            <div class="dialog-head">
                <b data-text="spellcrafter.wand.name"></b>
                <button id="settings-close" type="button"><svg class="icon"><use href="#icon-x" /></svg></button>
            </div>
            <div class="setting">
                <span class="setting-label" data-text="spellcrafter.gui.appearance"></span>
                <div id="skins"></div>
            </div>
            <div class="setting-row">
                <div class="setting">
                    <label class="setting-label" for="slot-cap" data-text="spellcrafter.gui.slots"></label>
                    <div class="stepper">
                        <span class="stepper-icon"><svg class="icon"><use href="#icon-grid" /></svg></span>
                        <input id="slot-cap" type="text" inputmode="numeric" maxlength="2" spellcheck="false" autocomplete="off">
                        <button type="button" data-stat="cap" data-delta="-1"><svg class="icon"><use href="#icon-minus" /></svg></button>
                        <button type="button" data-stat="cap" data-delta="1"><svg class="icon"><use href="#icon-plus" /></svg></button>
                    </div>
                </div>
                <div class="setting">
                    <label class="setting-label" for="mana" data-text="spellcrafter.gui.base_mana"></label>
                    <div class="stepper">
                        <span class="stepper-icon mana">◆</span>
                        <input id="mana" type="text" inputmode="numeric" maxlength="4" spellcheck="false" autocomplete="off">
                        <button type="button" data-stat="mana" data-delta="-5"><svg class="icon"><use href="#icon-minus" /></svg></button>
                        <button type="button" data-stat="mana" data-delta="5"><svg class="icon"><use href="#icon-plus" /></svg></button>
                    </div>
                </div>
                <div class="setting">
                    <label class="setting-label" for="cooldown" data-text="spellcrafter.gui.base_cooldown"></label>
                    <div class="stepper">
                        <span class="stepper-icon"><svg class="icon"><use href="#icon-clock" /></svg></span>
                        <input id="cooldown" type="text" inputmode="decimal" maxlength="6" spellcheck="false" autocomplete="off">
                        <button type="button" data-stat="cooldown" data-delta="-5"><svg class="icon"><use href="#icon-minus" /></svg></button>
                        <button type="button" data-stat="cooldown" data-delta="5"><svg class="icon"><use href="#icon-plus" /></svg></button>
                    </div>
                </div>
            </div>
            <div class="setting">
                <label class="setting-label" for="modifier" data-text="spellcrafter.type.modifier"></label>
                <div class="modifier">
                    <span id="modifier-icon"></span>
                    <select id="modifier"></select>
                </div>
            </div>
        </div>
    </dialog>

    <div id="language-menu" popover></div>
    <div id="popup" class="card" hidden></div>
    <canvas id="drag-image"></canvas>
</body>

</html>
