<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpellCrafter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png" sizes="16x16">
</head>

<body>
    <div class="topbar">
        <img class="spell-icon" src="favicon.png" alt="">
        <h1 class="title">
            SpellCrafter
        </h1>
        <button class="source-button" onclick="clickSourceButton()">
            Source
        </button>
    </div>
    <div class="content">
        <img class="spell-icon" src="assets/spell/homing.png" alt="Magic Missile">
        <img class="spell-icon" src="assets/spell/revealing_bolt.png" alt="Fire Bolt">
        <img class="spell-icon" src="assets/spell/summon_slime.png" alt="Fire Bolt">
    </div>
    <script src="script.js"></script>
</body>
